name: orderly_app
description: "Closr - AI-powered follow-ups for your business"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.0.0
  dio: ^5.4.0
  font_awesome_flutter: ^10.7.0
  shared_preferences: ^2.2.2
  supabase_flutter: ^2.0.0
  flutter_dotenv: ^5.1.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  qr_flutter: ^4.1.0
  pdf: ^3.11.1
  printing: ^5.13.1

  # 🔥 SPLASH
  flutter_native_splash: ^2.4.7
  speech_to_text: ^7.3.0
  app_links: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 🔥 APP ICON
  flutter_launcher_icons: ^0.13.1

# 🔥 APP ICON CONFIG
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon_1024.png"

  adaptive_icon_background: "#0B0F2A"
  adaptive_icon_foreground: "assets/icons/app_icon_1024.png"

# 🔥 NATIVE SPLASH CONFIG
flutter_native_splash:
  color: "#0B0F2A"
  image: assets/logo/logo.png

  android: true
  ios: true

  android_12:
    image: assets/logo/logo.png
    color: "#0B0F2A"

flutter:
  uses-material-design: true

  assets:
    - assets/env/default.env
    - assets/icons/
    - assets/logo/
